<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spoonful Caregiver</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 60px; display: flex; flex-direction: column; gap: 18px; }
  h1 { margin: 0; font-size: 30px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .card h3 { margin: 0 0 6px; font-size: 18px; }
  .card p { margin: 4px 0; color: var(--muted); }
  .card .big { font-size: 40px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
  .chart { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .chart svg { width: 100%; height: 200px; display: block; }
  .chart .bar { fill: var(--accent); }
  .chart text { fill: var(--muted); font-size: 11px; }
  .outbox { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .outbox blockquote { margin: 8px 0; font-size: 20px; }
  .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .top a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Caregiver</h1><span><a href="/">Back to Spoonful</a> · <a href="/api/bites.csv">Export CSV</a></span></div>
  <div class="outbox" id="outbox"><p class="note">No finished session yet.</p></div>
  <div class="chart"><h3 style="margin:0 0 8px">Bites taken per session</h3><svg id="chart" role="img" aria-label="Bites per session"></svg></div>
  <div class="cards" id="cards"></div>
</div>
<script>
"use strict";
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
async function load() {
  const d = await (await fetch("/api/sessions")).json();
  const ss = d.sessions;
  document.getElementById("cards").innerHTML = ss.map((s) => {
    const taken = (s.bite_rows.find((r) => r.outcome === "taken") || {}).n || 0;
    const when = new Date(s.started * 1000).toLocaleString();
    const mins = s.ended ? Math.max(1, Math.round((s.ended - s.started) / 60)) : null;
    return `<div class="card"><h3>${esc(s.profile)}</h3><p>${when}${mins ? " · " + mins + " min" : " · in progress"}</p>
      <div class="big">${taken}</div><p>bites taken of ${s.bites || 0} offered · ${s.pauses || 0} pauses · ${s.faults || 0} faults</p>
      ${s.summary ? `<p>${esc(s.summary)}</p><button data-sid="${s.id}">${s.summary_sent ? "Sent ✓ Send again" : "Send summary"}</button>` : ""}</div>`;
  }).join("") || '<p class="note">No sessions yet.</p>';

  const last = d.outbox[d.outbox.length - 1];
  const ob = document.getElementById("outbox");
  if (last) ob.innerHTML = `<h3 style="margin:0">Latest summary</h3><blockquote id="sum">${esc(last.text)}</blockquote>
     <div class="row"><button id="copy">Copy</button><button class="primary" id="send">Send by text</button>
     <span class="note" id="sendst">${last.sent ? "Sent" : esc(last.detail || "")}</span></div>`;
  const c = document.getElementById("copy"); if (c) c.onclick = () => navigator.clipboard.writeText(last.text);
  const sn = document.getElementById("send"); if (sn) sn.onclick = () => send(last.session_id);

  const data = ss.slice(0, 14).reverse().map((s) => ({ label: new Date(s.started * 1000).toLocaleDateString([], { month: "short", day: "numeric" }),
    v: (s.bite_rows.find((r) => r.outcome === "taken") || {}).n || 0 }));
  const svg = document.getElementById("chart"), W = 900, H = 200, pad = 24;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const max = Math.max(1, ...data.map((d) => d.v)), bw = data.length ? (W - pad * 2) / data.length : 0;
  svg.innerHTML = data.map((d, i) => {
    const h = (H - pad * 2) * d.v / max, x = pad + i * bw + bw * 0.15, y = H - pad - h;
    return `<rect class="bar" x="${x}" y="${y}" width="${bw * 0.7}" height="${h}" rx="4"><title>${d.v} bites</title></rect>
      <text x="${x + bw * 0.35}" y="${H - 6}" text-anchor="middle">${esc(d.label)}</text>
      <text x="${x + bw * 0.35}" y="${y - 4}" text-anchor="middle">${d.v}</text>`;
  }).join("");
}
async function send(sid) {
  const r = await fetch("/api/summary/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: sid }) });
  const j = await r.json(); const st = document.getElementById("sendst");
  if (st) st.textContent = j.sent ? "Sent" : (j.detail || j.detail === "" ? j.detail : "not sent");
  load();
}
document.getElementById("cards").onclick = (e) => { const s = e.target.dataset.sid; if (s) send(+s); };
load(); setInterval(load, 5000);
</script>
</body>
</html>
