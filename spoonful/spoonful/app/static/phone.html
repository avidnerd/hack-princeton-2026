<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spoonful camera</title>
<style>
  :root { --paper: #f6f8f8; --panel: #fff; --ink: #14212b; --steel: #5a6a75; --line: #d3dade; --arm: #0b7285; --stop: #cf2e1f; --go: #1f8a4c; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #0f171d; --panel: #17222a; --ink: #e8eef1; --steel: #93a3ad; --line: #2a3942; --arm: #4cc3d6; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink);
    font: 17px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 16px; min-height: 100vh; }
  h1 { font: 600 15px/1 Bahnschrift, "DIN Alternate", "Segoe UI", sans-serif; letter-spacing: .14em;
    text-transform: uppercase; color: var(--steel); margin: 0; }
  h2 { font-size: 21px; line-height: 1.25; margin: 0; }
  p { margin: 0; color: var(--steel); }
  section { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
  button, .shot { display: block; width: 100%; text-align: center; font: inherit; font-size: 20px; font-weight: 600;
    padding: 18px; border-radius: 8px; cursor: pointer; border: 1px solid var(--arm); background: var(--arm); color: #fff; }
  @media (prefers-color-scheme: dark) { button, .shot { color: #06181d; } }
  button.quiet { background: none; color: var(--arm); }
  button:active, .shot:active { filter: brightness(.92); }
  [aria-disabled="true"] { opacity: .55; pointer-events: none; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  video, #preview { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: none; background: #000; }
  .status { min-height: 1.4em; font-weight: 600; color: var(--ink); }
  .status.ok { color: var(--go); }
  .status.bad { color: var(--stop); }
</style>
</head>
<body>
<main>
  <h1>Spoonful</h1>

  <section>
    <h2>Table photo</h2>
    <p>One photo from straight above, with the robot's base, the spoon and every bowl in it.</p>
    <img id="preview" alt="The photo you took">
    <p class="status" id="photo-status" role="status"></p>
    <label class="shot" id="shot" for="file">Take photo</label>
    <input id="file" type="file" accept="image/*" capture="environment">
  </section>

  <section>
    <h2>Live camera</h2>
    <p>Stand the phone where it sees the spoon and the bowls, then leave it. The robot uses this view to line the
      spoon up over each bowl.</p>
    <video id="video" playsinline muted></video>
    <p class="status" id="live-status" role="status"></p>
    <button id="live">Start live camera</button>
    <button id="flip" class="quiet" hidden>Use the back camera</button>
  </section>
</main>
<script>
"use strict";
const TOKEN = "{{TOKEN}}";
const MAX_SIDE = 2000;      // table photo
const LIVE_SIDE = 960;      // live frames: enough to find a spoon tip, small enough to send ten times a second
const el = (id) => document.getElementById(id);
const say = (id, text, cls) => { el(id).textContent = text; el(id).className = "status " + (cls || ""); };

function toJpeg(source, w, h, maxSide, quality) {
  const k = Math.min(1, maxSide / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(source, 0, 0, c.width, c.height);
  return new Promise((resolve) => c.toBlob(resolve, "image/jpeg", quality));
}
function send(path, blob) {
  return fetch(`/api/phone/${path}/${TOKEN}`, { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob });
}
function explain(err) {
  if (err.status === 404) return "This link has expired. Scan the code on the laptop again.";
  return "Can't reach the laptop. Is the phone on the same Wi-Fi?";
}

// ---- table photo
el("file").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  el("preview").src = URL.createObjectURL(file);
  el("preview").style.display = "block";
  el("shot").setAttribute("aria-disabled", "true");
  say("photo-status", "Sending to the laptop");
  try {
    const img = new Image();
    await new Promise((ok, bad) => { img.onload = ok; img.onerror = bad; img.src = el("preview").src; });
    const blob = await toJpeg(img, img.width, img.height, MAX_SIDE, 0.9);
    const r = await send("photo", blob || file);
    if (!r.ok) throw r;
    say("photo-status", "Sent. Check the laptop screen.", "ok");
    el("shot").textContent = "Retake photo";
  } catch (err) { say("photo-status", explain(err), "bad"); }
  el("shot").removeAttribute("aria-disabled");
  e.target.value = "";
};

// ---- live camera
let stream = null, wake = null, sent = 0, failed = 0;
let facing = "user";        // the front camera: the phone can stand with its screen toward you
async function loop() {
  const v = el("video");
  let t0 = performance.now(), n0 = 0;
  while (stream) {
    try {
      const blob = await toJpeg(v, v.videoWidth, v.videoHeight, LIVE_SIDE, 0.7);
      const r = await send("frame", blob);
      if (!r.ok) throw r;
      sent++; failed = 0;
      const now = performance.now();
      if (now - t0 > 2000) { say("live-status", `Live · ${Math.round((sent - n0) / (now - t0) * 1000)} pictures a second`, "ok"); t0 = now; n0 = sent; }
    } catch (err) {
      if (++failed > 5) say("live-status", explain(err), "bad");
      await new Promise((r) => setTimeout(r, 500));
    }
  }
}
async function start() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    say("live-status", "This browser won't share the camera on this page. Open the link in Safari or Chrome.", "bad");
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 } }, audio: false });
  } catch (err) {
    say("live-status", "Camera access was refused. Allow the camera for this page and try again.", "bad");
    return;
  }
  const v = el("video");
  v.srcObject = stream; v.style.display = "block";
  await v.play();
  try { wake = await navigator.wakeLock.request("screen"); } catch (err) { /* older phones: turn off auto-lock by hand */ }
  el("live").textContent = "Stop live camera";
  el("live").classList.add("quiet");
  el("flip").hidden = false;
  el("flip").textContent = facing === "user" ? "Use the back camera" : "Use the front camera";
  say("live-status", wake ? "Starting" : "Starting. Keep this screen on (turn off auto-lock).");
  loop();
}
function stop() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
  if (wake) { wake.release(); wake = null; }
  el("video").style.display = "none";
  el("live").textContent = "Start live camera";
  el("live").classList.remove("quiet");
  el("flip").hidden = true;
  say("live-status", "");
}
el("live").onclick = () => (stream ? stop() : start());
el("flip").onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  stop();
  await start();
};
document.addEventListener("visibilitychange", async () => {     // the wake lock is dropped when the page is hidden
  if (stream && document.visibilityState === "visible") { try { wake = await navigator.wakeLock.request("screen"); } catch (err) { /* ignore */ } }
});
</script>
</body>
</html>
