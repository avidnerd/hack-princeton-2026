<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spoonful table photo</title>
<style>
  :root { --paper: #f6f8f8; --ink: #14212b; --steel: #5a6a75; --line: #d3dade; --arm: #0b7285; --stop: #cf2e1f; --go: #1f8a4c; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #0f171d; --ink: #e8eef1; --steel: #93a3ad; --line: #2a3942; --arm: #4cc3d6; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink);
    font: 17px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 18px; min-height: 100vh; }
  h1 { font: 600 15px/1 Bahnschrift, "DIN Alternate", "Segoe UI", sans-serif; letter-spacing: .14em;
    text-transform: uppercase; color: var(--steel); margin: 0; }
  p { margin: 0; }
  .lead { font-size: 22px; line-height: 1.25; font-weight: 600; }
  ul { margin: 0; padding-left: 20px; color: var(--steel); }
  .shot { display: block; text-align: center; background: var(--arm); color: #fff; font-size: 22px; font-weight: 600;
    padding: 22px; border-radius: 8px; cursor: pointer; margin-top: auto; }
  .shot:active { filter: brightness(.92); }
  .shot[aria-disabled="true"] { opacity: .55; pointer-events: none; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  #preview { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: none; }
  #status { min-height: 1.4em; font-weight: 600; }
  #status.ok { color: var(--go); }
  #status.bad { color: var(--stop); }
</style>
</head>
<body>
<main>
  <h1>Spoonful</h1>
  <p class="lead">Take one photo of the table from straight above.</p>
  <ul>
    <li>Hold the phone flat, about arm's length over the table.</li>
    <li>Keep the robot's base, the spoon and every bowl in the picture.</li>
  </ul>
  <img id="preview" alt="The photo you took">
  <p id="status" role="status"></p>
  <label class="shot" id="shot" for="file">Take photo</label>
  <input id="file" type="file" accept="image/*" capture="environment">
</main>
<script>
"use strict";
const TOKEN = "{{TOKEN}}";
const MAX_SIDE = 2000;
const el = (id) => document.getElementById(id);

function say(text, cls) { el("status").textContent = text; el("status").className = cls || ""; }

// Phone photos are 3-12 MB; the robot needs about 2000 px. Shrinking here makes the upload take a second.
function shrink(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((blob) => resolve(blob || file), "image/jpeg", 0.9);
    };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}

el("file").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  el("preview").src = URL.createObjectURL(file);
  el("preview").style.display = "block";
  el("shot").setAttribute("aria-disabled", "true");
  say("Sending to the laptop");
  try {
    const body = await shrink(file);
    const r = await fetch("/api/phone/photo/" + TOKEN, { method: "POST", headers: { "Content-Type": "image/jpeg" }, body });
    if (!r.ok) throw new Error(r.status === 404 ? "This link has expired. Scan the code on the laptop again." : "The laptop refused the photo.");
    say("Sent. Check the laptop screen.", "ok");
    el("shot").textContent = "Retake photo";
  } catch (err) {
    say(err.message.includes("Failed to fetch") ? "Can't reach the laptop. Is the phone on the same Wi-Fi?" : err.message, "bad");
  }
  el("shot").removeAttribute("aria-disabled");
  e.target.value = "";
};
</script>
</body>
</html>
