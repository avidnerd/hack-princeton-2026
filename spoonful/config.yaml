# Spoonful: every tunable lives here (R5). Values marked FILL are placeholders until hardware bring-up.
# Joint angles are degrees from servo centre (500 units); positive = increasing servo units.

arm:
  backend: sim                 # sim | xarm | raw   (CLI --backend overrides)
  servo_map: {base: 6, shoulder: 5, elbow: 4, wrist_pitch: 3, wrist_roll: 2, gripper: 1}   # verified 2026-11-13 (bringup watch)
  units_per_deg: 4.1667        # LX-15D: 1000 units over 240 deg. NOTE the xarm pkg assumes 250 deg; we never use its degree API.
  center_units: 500
  soft_limits_deg:             # servo deg = (units-500)/4.1667; 5 deg inside the hard stop or the servo's 0..1000 end (NOTES.md)
    base: [-115, 115]          # raw -156..1163: travel exceeds the servo, so servo ends limit
    shoulder: [-83, 83]        # raw 133..868
    elbow: [-115, 115]         # raw -40..1063: travel exceeds the servo, so servo ends limit
    wrist_pitch: [-105, 115]   # raw 39..1044
    wrist_roll: [-115, 103]    # raw -5..953
    gripper: [-75, 50]         # raw 164..729
  home_pose:   {base: -90.7, shoulder: 63.4, elbow: -64.3, wrist_pitch: 87.6, wrist_roll: -6.5}   # posed by hand + probe 2026-11-13 (units 122/764/232/865/473)
  park_pose:   {base: -90.7, shoulder: 63.4, elbow: -64.3, wrist_pitch: 87.6, wrist_roll: -6.5}   # = home until a park pose is recorded
  max_speed_deg_s: {default: 40, near_face: 12}
  max_accel_deg_s2: 120
  stream_hz: 50
  read_hz: 30
  read_median_window: 3
  contact_error_deg: 4.8       # = 20 units; commanded-vs-actual beyond this ...
  contact_hold_s: 0.3          # ... for this long = contact
  contact_grace_deg: 2.0       # extra allowance per 10 deg/s of commanded speed (servo lag)
  stop_torque_off_after_s: 1.0
  gripper_close_deg: null      # optional: hold the fingers at this angle; null = leave the gripper alone
  heartbeat_timeout_s: 0.25    # arm thread holds if the FSM stops calling heartbeat()
  trajectories_dir: data/trajectories
  sim_trajectories_dir: data/trajectories_sim
  blend_s: 0.4
  teach_downsample_deg: 2.0
  teach_median_window: 5
  mouth_arrive_mm: 6           # DELIVERING -> MOUTH_HOLD when the tip is this close to the target

kinematics:                    # simple planar chain + base yaw; FILL link lengths with a ruler
  base_height_mm: 67.2         # table to shoulder axis (ruler 2026-11-13)
  upper_arm_mm: 94.9           # shoulder axis to elbow axis (ruler)
  forearm_mm: 90.4             # elbow axis to wrist-pitch axis (ruler)
  tool_mm: 191.8               # wrist-pitch axis to spoon tip: 91.8 ruler to gripper servo face + 100 (CAD bowl_tip_ahead)
  tool_offset_mm: 30           # spoon tip above the tool axis (saddle on top of the gripper)
  sign: {base: 1, shoulder: -1, elbow: -1, wrist_pitch: 1}       # from jog 2026-11-13: +units = base CCW, shoulder/elbow back, wrist forward
  zero_deg: {base: -90.7, shoulder: 6.5, elbow: -5.0, wrist_pitch: -3.6}   # servo angle when the link points straight up (probe 2026-11-13: 527/479/485); base: facing the diner (units 122)
  face_zone:                   # base frame, mm (x forward, y left, z up). Spoon tip inside = permit required.
    x: [235, 600]
    y: [-200, 200]
    z: [150, 600]

camera: {index: 0, width: 1280, height: 720, fps: 30, mirror: false, fallback_width: 640, fallback_height: 360,
         min_fps_before_fallback: 15, jpeg_quality: 70,
         hfov_deg: 70, api: auto}   # FILL: hfov only matters until calibration measures the focal length
                                    # api auto = DirectShow on Windows; try msmf if FPS is low there

face:
  model_path: models/face_landmarker.task
  mouth_open_ratio_threshold: 0.08
  hysteresis_fraction: 0.7
  yaw_max_deg: 15
  pitch_max_deg: 20
  pitch_offset_deg: 0          # camera below the face reads as constant pitch; subtract it here
  presence_hold_s: 0.5
  mouth_open_hold_s: 0.3
  mouth_closed_taken_s: 0.5    # MOUTH_HOLD: mouth closed this long = food taken
  frame_max_age_ms: 150
  delivery_window_px: {x: [440, 840], y: [260, 560]}   # in 1280x720 frame coords; drag-box in the operator drawer
  ema_alpha: 0.4

offsets:
  px_per_mm_at_nominal: 3.0    # FILL from the calibration wizard
  max_correction_mm: 30
  rate_limit_mm_s: 10
  joint_map: data/calibration/offset_map.json
  joints: [base, shoulder, elbow, wrist_pitch]
  depth: true                  # follow the diner leaning in/back; needs the 'away' calibration sample
  focal_px: 0                  # 0 = from camera.hfov_deg; calibration fills it
  iris_mm: 11.7
  eyes_behind_lips_mm: 20
  max_depth_correction_mm: 40
  depth_deadband_mm: 8
  depth_person_reset_s: 3

gate: {backoff_mm: 50, retreat_after_s: 5,
       require_go: true, go_window_s: 5}   # approach needs a GO press (arcade button or Enter) on top of the face gate

fsm:
  tick_hz: 30
  pre_delivery_timeout_s: 20
  max_aborts_per_bite: 2
  stop_release_window_s: 30
  camera_fault_s: 2.0

pace: {min_interval_s: 4, default_interval_s: 9, min_bites_for_model: 5, swallow_threshold: 300,
       swallow_offset_s: 2.0, model: data/calibration/pace.json, auto_offer: false}

# say = the OS voice (macOS say / Windows SAPI). `voice` is a macOS voice name; Windows uses its default voice.
speech: {backend: say, voice: Samantha, elevenlabs_voice_id: "21m00Tcm4TlvDq8ikWAM", elevenlabs_model: eleven_turbo_v2_5,
         rate: 1.0, cooldown_s: 3, cache_dir: data/tts_cache, enabled: true}

voice:
  enabled: true                # voice is the hands-free STOP now that the button is GO
  wake: spoonful
  wake_aliases: [spoonful, spoon full, spoonfull, spoon fall]
  backend: faster_whisper      # faster_whisper | openai
  model: base                  # ~1.1 s from end of "stop" to STOP on this laptop (small: ~2.3 s). Speed beats accuracy for a stop
  min_confidence: 0.45
  bare_stop: true              # "stop" without the wake word still stops (safety beats the wake-word rule)
  sample_rate: 16000
  vad_rms: 0.015
  commands:
    bite: [bite, "next bite", "another", "ready", "more"]
    pause: [pause, wait, "hold on"]
    resume: [resume, continue, "go on"]
    stop: [stop]
    slower: [slower, "slow down"]
    faster: [faster, "speed up"]
    enough: ["that's enough", "thats enough", "i'm done", "im done", "all done", finished]
    sweet: [sweet]
    savory: [savory, savoury]

# ESP32 serial link OFF: only one micro-USB cable, and the arm needs it. The GO button is firmware/esp32_go_ble, a Bluetooth
# keyboard that types Page Down (= GO in the app). Enter / presenter clicker also = GO. See NOTES.md
esp32: {enabled: false, port: auto, baud: 115200, heartbeat_timeout_s: 3,
        button_role: go,   # arcade button (GPIO 4) is GO
        stop_switch: none}   # no physical STOP: voice, spacebar, UI, looking away, power switch. (rocker | button on GPIO 5 supported)

food: {enabled: false, backend: gemini, model: gemini-2.5-flash, interval_s: 5, bowl_roi: [0, 0, 1280, 720]}

app: {host: 127.0.0.1, port: 8000, ws_hz: 10, stream_fps: 15}

photon: {enabled: false, sidecar_url: "http://127.0.0.1:7777", caregiver_number: "+10000000000"}

profiles: {dir: data/profiles, default: demo}

log: {db: data/spoonful.db, servo_log_hz: 10}

calibration: {dir: data/calibration, max_age_h: 24}
